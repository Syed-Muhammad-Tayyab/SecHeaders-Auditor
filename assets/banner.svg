<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#4dd8c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ec4b6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2ec4b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1030" cy="140" r="220" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
    <line x1="60" y1="235" x2="1140" y2="235"/>
  </g>
  <g fill="#2ec4b6">
    <circle cx="90" cy="235" r="4"/>
    <circle cx="150" cy="235" r="4"/>
    <circle cx="210" cy="235" r="4"/>
  </g>

  <!-- shield-with-checkmark icon -->
  <g transform="translate(78,58)">
    <path d="M 52 0 L 100 18 L 100 62 C 100 96 78 118 52 128 C 26 118 4 96 4 62 L 4 18 Z"
          fill="url(#accent)" opacity="0.95"/>
    <path d="M 30 62 L 46 78 L 76 42" fill="none" stroke="#0d1b2a" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="215" y="118" font-family="Verdana, Geneva, sans-serif" font-size="44" font-weight="700" fill="#ffffff">
    SecHeaders-Auditor
  </text>
  <text x="217" y="155" font-family="Verdana, Geneva, sans-serif" font-size="19" fill="#2ec4b6">
    HTTP Security Header Scanner &amp; Hardening Reports
  </text>
  <text x="217" y="182" font-family="'Courier New', monospace" font-size="14" fill="#8ba3ac">
    CSP · HSTS · X-Frame-Options · Referrer-Policy · Permissions-Policy
  </text>

  <text x="217" y="245" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#5f7a82">
    by Syed Muhammad Tayyab · github.com/Syed-Muhammad-Tayyab
  </text>
</svg>
